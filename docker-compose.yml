# Senti organization side: backend API + admin panel + a small "corporate model".
# The local engine and hooks run natively on each Mac (never in Docker).
#
#   cp .env.example .env   # optional: change passwords / model
#   docker compose up -d --build
#   admin panel:  https://localhost:8443  (admin@senti.local / senti-admin by default; self-signed certificate)
#   device API:   https://localhost:8443  (the Devices page shows the enroll command with the certificate fingerprint)
name: senti

services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: [{path: .env, required: false}]
    environment:
      SENTI_DATA_DIR: /data
      SENTI_CORP_MODEL_URL: ${SENTI_CORP_MODEL_URL:-http://ollama:11434/v1}
      SENTI_CORP_MODEL: ${SENTI_CORP_MODEL:-qwen2.5:3b}
      SENTI_CORS_ORIGINS: ${SENTI_CORS_ORIGINS:-http://localhost:8080}
      # shared demo code, off unless set (20 uses, 7 days); real Macs use codes from the Devices page
      SENTI_DEMO_ENROLL_CODE: ${SENTI_DEMO_ENROLL_CODE:-}
      SENTI_TLS_CERT: /tls/cert.pem
      SENTI_HTTPS_PORT: ${SENTI_HTTPS_PORT:-8443}
    volumes:
      - backend-data:/data
      - tls:/tls:ro
    ports:
      # Plain HTTP for local development only (always 127.0.0.1). Macs use https://HOST:8443 via the admin container.
      - "127.0.0.1:${SENTI_BACKEND_PORT:-8000}:8000"

  admin:
    build: ./admin
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # names/IPs the certificate is valid for (Macs pin it by fingerprint anyway)
      SENTI_TLS_HOSTS: ${SENTI_TLS_HOSTS:-localhost,127.0.0.1}
    volumes:
      - tls:/tls
    ports:
      # HTTPS for the admin panel and the device API (TLS by default); HTTP only redirects
      - "${SENTI_BIND:-127.0.0.1}:${SENTI_HTTPS_PORT:-8443}:443"
      - "${SENTI_BIND:-127.0.0.1}:${SENTI_ADMIN_PORT:-8081}:80"

  # The "corporate model": a small open model served by Ollama (CPU inside Docker, fits a 16 GB laptop).
  # Swap for a real company endpoint by setting SENTI_CORP_MODEL_URL / SENTI_CORP_MODEL (or in the admin panel).
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PARALLEL: "2"
      CORP_MODEL: ${SENTI_CORP_MODEL:-qwen2.5:3b}
    entrypoint: ["/bin/sh", "-c", "ollama serve & pid=$!; sleep 3; ollama pull \"$$CORP_MODEL\"; wait $$pid"]
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "127.0.0.1:${SENTI_OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q \"$$CORP_MODEL\""]
      interval: 15s
      timeout: 5s
      retries: 60
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 6g

volumes:
  tls:
  backend-data:
  ollama-models:
