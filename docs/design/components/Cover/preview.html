<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Senti</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=DM+Sans:opsz,wght@9..40,400..700&display=swap">
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .brand { fill:var(--terracotta); }
  .deep { fill:var(--ink); }
  .tint { fill:var(--sand); }
  .lg { rx:var(--radius-lg); }
  .md { rx:var(--radius-md); }
  .dot { fill:var(--terracotta); }
  .wave { fill:none; stroke:var(--sage); stroke-width:8px; stroke-linecap:round; }
  .wave.cut { stroke:var(--surface); }
  .words { position:absolute; left:var(--space-8); bottom:var(--space-8); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-size:120px; line-height:.92; font-weight:600; letter-spacing:-.03em; color:var(--ink); }
  .tag { margin:var(--space-2) 0 0 6px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      terracotta 168x280 bled off the top (the brand, largest) · ink 296x168 bleeding off the right · sand 160x48 strip bleeding right — about 35% of 960x288
  arrangement one tall terracotta slab with an ink slab and a thin sand strip beside it, bottoms on one line space-12 above the edge, space-4 gutters
  pattern     literal motif, the bark wave from "It barks only when it matters": three sage arcs radiating from a terracotta dot on the ink slab, two surface arcs cut into the terracotta slab
  scales      gutters space-4; arc pitch space-6; wave stroke space-2; corners radius-lg on slabs, radius-md on the strip; dot radius space-3
-->
<rect class="brand lg" x="24" y="-40" width="168" height="280" rx="20"/>
<rect class="tint md" x="208" y="8" width="296" height="48" rx="12"/>
<rect class="deep lg" x="208" y="72" width="296" height="168" rx="20"/>
<path class="wave cut" d="M72 212 A36 36 0 0 1 144 212"/>
<path class="wave cut" d="M48 212 A60 60 0 0 1 168 212"/>
<circle class="dot" cx="248" cy="156" r="12"/>
<path class="wave" d="M272 132 A34 34 0 0 1 272 180"/>
<path class="wave" d="M290 114 A58 58 0 0 1 290 198"/>
<path class="wave" d="M308 96 A82 82 0 0 1 308 216"/>
</svg>
</div>
<div class="words">
<h1 class="name">Senti</h1>
<p class="tag">A watchdog for your AI agents. Warm, loyal, and quiet until it matters.</p>
</div>
</div>
</body>
</html>
