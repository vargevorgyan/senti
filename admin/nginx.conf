server_tokens off;
# Per-IP limits in front of the backend's own lockout: sign-in and joining are the only anonymous entry points.
limit_req_zone $binary_remote_addr zone=senti_signin:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=senti_join:10m rate=20r/m;
limit_req_status 429;

# Plain HTTP only redirects to HTTPS.
server {
  listen 80;
  server_name _;
  return 301 https://$host:8443$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;
  ssl_certificate     /tls/cert.pem;
  ssl_certificate_key /tls/key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_session_tickets off;
  client_max_body_size 5m;
  include /etc/nginx/snippets/senti-security-headers.conf;
  root /usr/share/nginx/html;

  location ~ ^/api/v1/auth/(login|login/code|two-factor/setup)$ {
    limit_req zone=senti_signin burst=5 nodelay;
    include /etc/nginx/snippets/senti-proxy.conf;
  }
  location /api/v1/devices/ {
    limit_req zone=senti_join burst=10 nodelay;
    include /etc/nginx/snippets/senti-proxy.conf;
  }
  # API (admin + device + MCP gateway) and Server-Sent Events go to the backend container.
  location /api/ {
    include /etc/nginx/snippets/senti-proxy.conf;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/senti-security-headers.conf;
  }
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/senti-security-headers.conf;
  }
}
